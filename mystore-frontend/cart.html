<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StyleHub - Cart</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>


<header>

    <div class="logo">
        StyleHub
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Products
        </a>

        <a href="cart.html">
            Cart
            <span id="cart-count">0</span>
        </a>

    </nav>

</header>


<main class="container">

    <h1>
        Shopping Cart
    </h1>


    <!-- Cart items generated by JavaScript -->

    <div id="cart-container">
    </div>


    <!-- Total -->

    <div class="cart-total">

        <h2>
            Grand Total:
            <span id="grand-total">
                ₹0
            </span>
        </h2>

    </div>


    <div class="cart-actions">

        <a href="products.html"
           class="btn secondary">
            Continue Shopping
        </a>

        <a href="checkout.html"
           class="btn">
            Proceed to Checkout
        </a>

    </div>

</main>


<footer>

    <p>
        Contact: support@stylehub.com |
        Phone: +91 98765 43210
    </p>

    <p>
        &copy; 2026 StyleHub.
        All Rights Reserved.
    </p>

</footer>


<script src="script.js"></script>

</body>

</html>
