<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StyleHub - Checkout</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>


<header>

    <div class="logo">
        StyleHub
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Products
        </a>

        <a href="cart.html">
            Cart
            <span id="cart-count">0</span>
        </a>

    </nav>

</header>


<main class="container">

    <div class="checkout-box">

        <h1>
            Checkout
        </h1>


        <form id="checkout-form">


            <!-- Name -->

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
            >


            <!-- Address -->

            <label for="address">
                Address
            </label>

            <input
                type="text"
                id="address"
                placeholder="Enter your address"
            >


            <!-- City -->

            <label for="city">
                City
            </label>

            <input
                type="text"
                id="city"
                placeholder="Enter your city"
            >


            <!-- Pincode -->

            <label for="pincode">
                Pincode
            </label>

            <input
                type="text"
                id="pincode"
                maxlength="6"
                placeholder="Enter 6 digit pincode"
            >


            <!-- Phone -->

            <label for="phone">
                Phone
            </label>

            <input
                type="tel"
                id="phone"
                maxlength="10"
                placeholder="Enter 10 digit phone number"
            >


            <!-- Payment -->

            <h3>
                Payment Method
            </h3>


            <div class="payment-options">

                <label>
                    <input
                        type="radio"
                        name="payment"
                        value="cod"
                    >

                    Cash on Delivery
                </label>


                <label>
                    <input
                        type="radio"
                        name="payment"
                        value="upi"
                    >

                    UPI
                </label>


                <label>
                    <input
                        type="radio"
                        name="payment"
                        value="card"
                    >

                    Credit/Debit Card
                </label>

            </div>


            <button
                type="submit"
                class="btn">

                Place Order

            </button>

        </form>


        <!-- Confirmation -->

        <div id="confirmation">
        </div>

    </div>

</main>


<footer>

    <p>
        Contact: support@stylehub.com |
        Phone: +91 98765 43210
    </p>

    <p>
        &copy; 2026 StyleHub.
        All Rights Reserved.
    </p>

</footer>


<script src="script.js"></script>

</body>

</html>
